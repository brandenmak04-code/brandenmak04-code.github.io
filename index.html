<head>

<title>NLB Booker</title>
<style>
  :root { color-scheme: light dark; --bg: #ffffff; --fg: #1a1a1a; --muted: #555; --link: #0b57d0; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121212; --fg: #e8e8e8; --muted: #aaa; --link: #8ab4f8; }
  }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 32px 16px; }
  h1 { font-size: 1.8em; margin: 0 0 16px; }
  a { color: var(--link); }
  footer { margin-top: 32px; color: var(--muted); font-size: 0.95em; }
</style>
</head>
<body>
<main>
  <h1>NLB Booker</h1>
  <p>NLB Booker is a personal Telegram bot that books study seats at National Library Board (Singapore) libraries for its owner, Branden Mak. It is a private tool, not a public service.</p>
  <p><a href="privacy.html">Privacy Policy</a></p>
  <footer>Contact: <a href="mailto:brandenmak.04@gmail.com">brandenmak.04@gmail.com</a></footer>
</main>
</body>
</html>
